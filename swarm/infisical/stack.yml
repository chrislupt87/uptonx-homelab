version: "3.8"

services:
  infisical:
    image: infisical/infisical:latest
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: "${INFISICAL_ENCRYPTION_KEY}"
      AUTH_SECRET: "${INFISICAL_AUTH_SECRET}"
      DB_CONNECTION_URI: "postgresql://infisical:${INFISICAL_POSTGRES_PASSWORD}@postgres:5432/infisical?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      SITE_URL: "https://infisical.uptonx.com"
    ports:
      - "8093:8080"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ai

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: "${INFISICAL_POSTGRES_PASSWORD}"
      POSTGRES_DB: infisical
    volumes:
      - /opt/infisical/postgres:/var/lib/postgresql/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ai

  redis:
    image: redis:7-alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ai
