http:
  routers:
    technitium:
      rule: "Host(`dns.uptonx.com`)"
      service: technitium
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    # traefik-dashboard: moved to traefik-dashboard-protected (authentik forward-auth)

    email-rag:
      rule: "Host(`email-rag.uptonx.com`)"
      service: email-rag
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    chat:
      rule: "Host(`chat.uptonx.com`)"
      service: chat
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    audio:
      rule: "Host(`audio.uptonx.com`)"
      service: audio
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    # frigate: moved to frigate-protected (authentik forward-auth)

    cody:
      rule: "Host(`cody.uptonx.com`)"
      service: cody
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    landing:
      rule: "Host(`uptonx.com`) || Host(`www.uptonx.com`)"
      service: landing
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    status:
      rule: "Host(`status.uptonx.com`)"
      service: status
      middlewares:
        - allow-iframe
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    # grafana: moved to grafana-protected (authentik forward-auth)

    double-take:
      rule: "Host(`dt.uptonx.com`)"
      service: double-take
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    # n8n-video: moved to n8n-video-protected (authentik forward-auth)

    compreface:
      rule: "Host(`faces.uptonx.com`)"
      service: compreface
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    infisical:
      rule: "Host(`infisical.uptonx.com`)"
      service: infisical
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    portainer:
      rule: "Host(`portainer.uptonx.com`)"
      service: portainer
      middlewares:
        - authentik
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    # --- Authentik SSO ---
    authentik:
      rule: "Host(`auth.uptonx.com`)"
      service: authentik
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    authentik-outpost:
      rule: "Host(`auth.uptonx.com`) && PathPrefix(`/outpost.goauthentik.io/`)"
      service: authentik
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    # --- Protected routes (forward-auth via Authentik) ---
    traefik-dashboard-protected:
      rule: "Host(`traefik.uptonx.com`)"
      service: traefik-dashboard
      middlewares:
        - authentik
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    grafana-protected:
      rule: "Host(`grafana.uptonx.com`)"
      service: grafana
      middlewares:
        - authentik
        - allow-iframe
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    frigate-protected:
      rule: "Host(`frigate.uptonx.com`)"
      service: frigate
      middlewares:
        - authentik
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

    n8n-video-protected:
      rule: "Host(`n8n.uptonx.com`)"
      service: n8n-video
      middlewares:
        - authentik
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

  middlewares:
    allow-iframe:
      headers:
        customResponseHeaders:
          X-Frame-Options: ""
          Content-Security-Policy: ""

    authentik:
      forwardAuth:
        address: "http://192.168.1.16:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

  services:
    technitium:
      loadBalancer:
        servers:
          - url: "http://192.168.1.51:5380"

    traefik-dashboard:
      loadBalancer:
        servers:
          - url: "http://192.168.1.15:8080"

    email-rag:
      loadBalancer:
        servers:
          - url: "http://192.168.1.110:3000"

    chat:
      loadBalancer:
        servers:
          - url: "http://192.168.1.110:8080"

    audio:
      loadBalancer:
        servers:
          - url: "http://192.168.1.74:8090"

    frigate:
      loadBalancer:
        servers:
          - url: "http://192.168.1.18:5000"

    cody:
      loadBalancer:
        servers:
          - url: "http://192.168.1.23:8091"

    landing:
      loadBalancer:
        servers:
          - url: "http://192.168.1.23:8092"

    status:
      loadBalancer:
        servers:
          - url: "http://192.168.1.69:3001"

    grafana:
      loadBalancer:
        servers:
          - url: "http://192.168.1.23:3002"

    double-take:
      loadBalancer:
        servers:
          - url: "http://192.168.1.69:3000"

    n8n-video:
      loadBalancer:
        servers:
          - url: "http://192.168.1.69:5678"

    compreface:
      loadBalancer:
        servers:
          - url: "http://192.168.1.69:8000"

    infisical:
      loadBalancer:
        servers:
          - url: "http://192.168.1.69:8093"

    portainer:
      loadBalancer:
        servers:
          - url: "http://192.168.1.23:9000"

    authentik:
      loadBalancer:
        servers:
          - url: "http://192.168.1.16:9000"
