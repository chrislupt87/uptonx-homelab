# ─────────────────────────────────────────────────────────────
# Kitty Terminal Config — Optimized for Claude Code
# Catppuccin Mocha · JetBrains Mono · Homelab Workstation
# ─────────────────────────────────────────────────────────────

# ── Font ─────────────────────────────────────────────────────
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        14.0
disable_ligatures never

# ── Window ───────────────────────────────────────────────────
background_opacity         0.92
dynamic_background_opacity yes
window_padding_width       8
remember_window_size       yes
initial_window_width       160c
initial_window_height      45c
confirm_os_window_close    0
hide_window_decorations    no
resize_in_steps            yes
placement_strategy         center

# ── Cursor ───────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# ── Scrollback ───────────────────────────────────────────────
# Large scrollback for long Claude Code sessions
scrollback_lines              50000
scrollback_pager_history_size 100
wheel_scroll_multiplier       5.0
touch_scroll_multiplier       3.0

# ── Mouse ────────────────────────────────────────────────────
copy_on_select          clipboard
mouse_hide_wait         3.0
url_style               curly
open_url_with           default
detect_urls             yes
strip_trailing_spaces   smart

# ── Bell ─────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0
window_alert_on_bell yes
bell_on_tab          "🔔 "

# ── Tab Bar ──────────────────────────────────────────────────
tab_bar_edge         top
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_min_tabs     1
tab_title_template   "{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Performance (Claude Code outputs a lot of text) ─────────
repaint_delay    6
input_delay      1
sync_to_monitor  yes

# ── Shell Integration ───────────────────────────────────────
shell_integration    enabled
allow_remote_control yes
listen_on            unix:/tmp/kitty-{kitty_pid}

# ── Clipboard / Paste ───────────────────────────────────────
# Bracketed paste mode — critical for pasting into Claude Code
# without it accidentally submitting multi-line content
paste_actions quote-urls-at-prompt,confirm-if-large

# ── Layouts ──────────────────────────────────────────────────
enabled_layouts splits,tall,fat,grid,stack

# ─────────────────────────────────────────────────────────────
# KEYBINDINGS
# Designed to NOT conflict with Claude Code shortcuts:
#   Reserved by Claude: Ctrl+C, Ctrl+D, Ctrl+R, Ctrl+U, Ctrl+K,
#   Ctrl+B, Ctrl+T, Ctrl+O, Ctrl+L, Ctrl+G, Ctrl+V, Ctrl+F,
#   Ctrl+S, Ctrl+\, Shift+Tab, Alt+P, Alt+T, Alt+B, Alt+F
# ─────────────────────────────────────────────────────────────

# Clear all default shortcuts first for a clean slate
clear_all_shortcuts yes

# ── Copy / Paste ─────────────────────────────────────────────
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard
map shift+insert  paste_from_clipboard

# ── Scrolling ────────────────────────────────────────────────
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
map shift+home      scroll_home
map shift+end       scroll_end
map ctrl+shift+up   scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+h    show_scrollback

# ── Font Size ────────────────────────────────────────────────
map ctrl+equal      change_font_size all +1.0
map ctrl+minus      change_font_size all -1.0
map ctrl+0          change_font_size all 0
map ctrl+shift+equal change_font_size all +0.5

# ── Tabs ─────────────────────────────────────────────────────
map ctrl+shift+t    new_tab_with_cwd
map ctrl+shift+w    close_tab
map ctrl+tab        next_tab
map ctrl+shift+tab  previous_tab
map ctrl+shift+.    move_tab_forward
map ctrl+shift+,    move_tab_backward
map ctrl+shift+alt+t set_tab_title

# Direct tab access (Ctrl+1 through Ctrl+9)
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9

# ── Splits (Windows) ────────────────────────────────────────
map ctrl+shift+\      launch --location=vsplit --cwd=current
map ctrl+shift+minus  launch --location=hsplit --cwd=current

# Navigate splits (Alt+Arrow — safe, doesn't conflict with Claude)
map alt+left    neighboring_window left
map alt+right   neighboring_window right
map alt+up      neighboring_window up
map alt+down    neighboring_window down

# Resize splits
map ctrl+alt+left   resize_window narrower  3
map ctrl+alt+right  resize_window wider     3
map ctrl+alt+up     resize_window taller    3
map ctrl+alt+down   resize_window shorter   3
map ctrl+alt+0      resize_window reset

# Close split
map ctrl+shift+q    close_window

# ── Layouts ──────────────────────────────────────────────────
map ctrl+shift+l    next_layout
map ctrl+shift+z    toggle_layout stack

# ── Search ───────────────────────────────────────────────────
map ctrl+shift+f    show_scrollback

# ── Opacity (dynamic) ───────────────────────────────────────
map ctrl+shift+a>m  set_background_opacity +0.05
map ctrl+shift+a>l  set_background_opacity -0.05
map ctrl+shift+a>d  set_background_opacity default

# ── Misc ─────────────────────────────────────────────────────
map ctrl+shift+f5   load_config_file
map ctrl+shift+f6   debug_config
map ctrl+shift+u    kitten unicode_input
map f11             toggle_fullscreen

# ── Pass-through for Claude Code ─────────────────────────────
# These are explicitly NOT mapped so they pass through to Claude:
# Ctrl+C  → interrupt/cancel
# Ctrl+D  → exit
# Ctrl+R  → reverse search
# Ctrl+U  → delete line
# Ctrl+K  → delete to EOL
# Ctrl+B  → background tasks
# Ctrl+T  → task list
# Ctrl+O  → verbose output
# Ctrl+L  → clear screen
# Ctrl+G  → external editor
# Ctrl+V  → paste image (Claude)
# Ctrl+F  → kill background agents
# Ctrl+S  → stash prompt
# Ctrl+\  → undo
# Enter   → submit
# Shift+Enter → multiline (native in Kitty)
# Shift+Tab   → cycle permission modes

