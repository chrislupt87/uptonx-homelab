<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homelab Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; height: 100vh; }

  /* Page container */
  .page { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 56px; overflow: hidden; }
  .page.active { display: flex; flex-direction: column; }

  /* Camera grid */
  .cam-grid { display: grid; flex: 1; gap: 4px; padding: 4px; }
  .cam-grid.cols-3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; }
  .cam-grid.cols-2x2 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
  .cam-cell { position: relative; background: #111118; border-radius: 6px; overflow: hidden; }
  .cam-cell img { width: 100%; height: 100%; object-fit: cover; }
  .cam-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 4px 10px; background: linear-gradient(transparent, rgba(0,0,0,0.85)); font-size: 13px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
  .cam-cell.offline img { opacity: 0.3; }
  .cam-cell.offline::after { content: 'OFFLINE'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #ff4444; font-size: 18px; font-weight: 700; }

  /* Iframe pages */
  .page iframe { flex: 1; border: none; background: #111; }

  /* System stats page */
  .stats-page { padding: 16px; overflow-y: auto; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .host-card { background: #111118; border-radius: 8px; padding: 16px; border: 1px solid #1a1a2e; }
  .host-card h3 { font-size: 16px; color: #00e5ff; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .stat-label { font-size: 12px; color: #888; text-transform: uppercase; }
  .stat-value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-bar { height: 6px; background: #1a1a2e; border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
  .stat-bar-fill.cpu { background: linear-gradient(90deg, #00e5ff, #00b8d4); }
  .stat-bar-fill.mem { background: linear-gradient(90deg, #7c4dff, #651fff); }
  .stat-bar-fill.high { background: linear-gradient(90deg, #ff9100, #ff3d00); }
  .uptime-text { font-size: 11px; color: #666; margin-top: 4px; }

  /* Tab bar */
  .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: #0d0d14; border-top: 1px solid #1a1a2e; display: flex; z-index: 100; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #555; transition: color 0.2s; -webkit-tap-highlight-color: transparent; }
  .tab.active { color: #00e5ff; }
  .tab svg { width: 22px; height: 22px; margin-bottom: 2px; }
  .tab span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Auto-rotate indicator */
  .rotate-btn { position: fixed; top: 8px; right: 8px; z-index: 200; background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 20px; padding: 4px 12px; color: #888; font-size: 11px; cursor: pointer; }
  .rotate-btn.on { color: #00e5ff; border-color: #00e5ff; }
</style>
</head>
<body>

<!-- Page 1: Outdoor Cameras (Reolinks) -->
<div class="page" id="page-outdoor">
  <div class="cam-grid cols-3">
    <div class="cam-cell" id="cam-reolink_86"><img><div class="cam-label">Reolink 86</div></div>
    <div class="cam-cell" id="cam-reolink_87"><img><div class="cam-label">Reolink 87</div></div>
    <div class="cam-cell" id="cam-reolink_85"><img><div class="cam-label">Reolink 85</div></div>
  </div>
</div>

<!-- Page 2: Nest Cameras -->
<div class="page" id="page-nest">
  <div class="cam-grid cols-3">
    <div class="cam-cell" id="cam-nest_entrance"><img><div class="cam-label">Entrance</div></div>
    <div class="cam-cell" id="cam-nest_living_north"><img><div class="cam-label">Living North</div></div>
    <div class="cam-cell" id="cam-nest_living_south"><img><div class="cam-label">Living South</div></div>
  </div>
</div>

<!-- Page 3: Indoor Cameras -->
<div class="page" id="page-indoor">
  <div class="cam-grid cols-2x2">
    <div class="cam-cell" id="cam-tapo_46"><img><div class="cam-label">Tapo 46</div></div>
    <div class="cam-cell" id="cam-eufy_kitchen"><img><div class="cam-label">Eufy Kitchen</div></div>
    <div class="cam-cell" id="cam-eufy_living_north"><img><div class="cam-label">Eufy Living N</div></div>
    <div class="cam-cell" id="cam-eufy_living_south"><img><div class="cam-label">Eufy Living S</div></div>
  </div>
</div>

<!-- Page 4: Uptime Kuma -->
<div class="page" id="page-status">
  <iframe src="http://127.0.0.1:3001/status/homelab" id="kuma-frame" loading="lazy"></iframe>
</div>

<!-- Page 5: System Stats -->
<div class="page stats-page" id="page-system">
  <div class="stats-grid" id="stats-grid"></div>
</div>

<!-- Auto-rotate button -->
<div class="rotate-btn on" id="rotate-btn" onclick="toggleRotate()">AUTO</div>

<!-- Tab Bar -->
<div class="tab-bar">
  <div class="tab active" onclick="showPage('outdoor')" data-page="outdoor">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M14.31 8l5.74 9.94M9.69 8h11.48M7.38 12l5.74-9.94M9.69 16L3.95 6.06M14.31 16H2.83M16.62 12l-5.74 9.94"/></svg>
    <span>Outdoor</span>
  </div>
  <div class="tab" onclick="showPage('nest')" data-page="nest">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Nest</span>
  </div>
  <div class="tab" onclick="showPage('indoor')" data-page="indoor">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <span>Indoor</span>
  </div>
  <div class="tab" onclick="showPage('status')" data-page="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    <span>Status</span>
  </div>
  <div class="tab" onclick="showPage('system')" data-page="system">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    <span>System</span>
  </div>
</div>

<script>
const FRIGATE = 'http://192.168.1.18:5000';
const STATS_API = 'http://127.0.0.1:8088';
const CAMERAS = [
  'reolink_86','reolink_87','reolink_85',
  'nest_entrance','nest_living_north','nest_living_south',
  'tapo_46','eufy_kitchen','eufy_living_north','eufy_living_south'
];
const PAGES = ['outdoor','nest','indoor','status','system'];
const ROTATE_INTERVAL = 30000;

let currentPage = 'outdoor';
let autoRotate = true;
let rotateTimer = null;

function showPage(name) {
  currentPage = name;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.page === name));
  resetRotateTimer();
}

function toggleRotate() {
  autoRotate = !autoRotate;
  document.getElementById('rotate-btn').classList.toggle('on', autoRotate);
  if (autoRotate) resetRotateTimer();
  else clearTimeout(rotateTimer);
}

function resetRotateTimer() {
  clearTimeout(rotateTimer);
  if (autoRotate) {
    rotateTimer = setTimeout(() => {
      const idx = (PAGES.indexOf(currentPage) + 1) % PAGES.length;
      showPage(PAGES[idx]);
    }, ROTATE_INTERVAL);
  }
}

// Camera snapshot refresh
function refreshCameras() {
  const ts = Date.now();
  CAMERAS.forEach(cam => {
    const cell = document.getElementById('cam-' + cam);
    if (!cell) return;
    const img = cell.querySelector('img');
    const newImg = new Image();
    newImg.onload = function() {
      img.src = this.src;
      cell.classList.remove('offline');
    };
    newImg.onerror = function() {
      cell.classList.add('offline');
    };
    newImg.src = FRIGATE + '/api/' + cam + '/latest.jpg?h=480&ts=' + ts;
  });
}

// System stats
function refreshStats() {
  fetch(STATS_API + '/api/stats')
    .then(r => r.json())
    .then(hosts => {
      const grid = document.getElementById('stats-grid');
      grid.innerHTML = '';
      hosts.forEach(h => {
        const cpuClass = h.cpu > 80 ? 'high' : 'cpu';
        const memClass = h.mem_pct > 80 ? 'high' : 'mem';
        grid.innerHTML += `
          <div class="host-card">
            <h3>${h.name}</h3>
            <div class="stat-row"><span class="stat-label">CPU</span><span class="stat-value">${h.cpu.toFixed(1)}%</span></div>
            <div class="stat-bar"><div class="stat-bar-fill ${cpuClass}" style="width:${h.cpu}%"></div></div>
            <div class="stat-row" style="margin-top:12px"><span class="stat-label">Memory</span><span class="stat-value">${h.mem_used} / ${h.mem_total}</span></div>
            <div class="stat-bar"><div class="stat-bar-fill ${memClass}" style="width:${h.mem_pct}%"></div></div>
            <div class="stat-row" style="margin-top:12px"><span class="stat-label">Load</span><span class="stat-value">${h.load || '-'}</span></div>
            <div class="uptime-text">Up ${h.uptime || '-'}</div>
          </div>`;
      });
    })
    .catch(() => {});
}

// Touch swipe support
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) > 80) {
    const dir = diff > 0 ? -1 : 1;
    const idx = (PAGES.indexOf(currentPage) + dir + PAGES.length) % PAGES.length;
    showPage(PAGES[idx]);
  }
});

// Init
showPage('outdoor');
refreshCameras();
refreshStats();
setInterval(refreshCameras, 2000);
setInterval(refreshStats, 10000);
</script>
</body>
</html>
