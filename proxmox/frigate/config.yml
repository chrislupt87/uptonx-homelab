mqtt:
  host: 127.0.0.1
  port: 1883
database:
  path: /config/frigate.db
go2rtc:
  streams:
    reolink_86:
    - rtsp://admin:Terry!87@192.168.40.11:554/h264Preview_01_main
    reolink_86_sub:
    - rtsp://admin:Terry!87@192.168.40.11:554/h264Preview_01_sub
    reolink_87:
    - rtsp://admin:Terry!87@192.168.40.12:554/h264Preview_01_main
    reolink_87_sub:
    - rtsp://admin:Terry!87@192.168.40.12:554/h264Preview_01_sub
    reolink_85:
    - rtsp://admin:Terry!87@192.168.40.13:554/h264Preview_01_main
    reolink_85_sub:
    - rtsp://admin:Terry!87@192.168.40.13:554/h264Preview_01_sub
    tapo_46:
    - rtsp://chris87:Zooey87!@192.168.40.30:554/stream1
    tapo_46_sub:
    - rtsp://chris87:Zooey87!@192.168.40.30:554/stream2
    eufy_living_pan:
    - rtsp://Christopher12345:Frigate123456789@192.168.1.162/live0
    eufy_kitchen:
    - rtsp://127.0.0.1:8553/eufy_kitchen
    eufy_living_north:
    - rtsp://127.0.0.1:8553/eufy_living_north
    eufy_living_south:
    - rtsp://127.0.0.1:8553/eufy_living_south
    # Nest cameras — hardcode credentials on deploy (env var substitution crashes go2rtc)
    # See .env.example for required values. Deploy with: envsubst < config.yml > /etc/frigate/config.yml
    nest_living_north:
    - "nest:?client_id=NEST_CLIENT_ID&client_secret=NEST_CLIENT_SECRET&refresh_token=NEST_REFRESH_TOKEN&project_id=NEST_PROJECT_ID&device_id=NEST_CAM_NORTH_ID"
    nest_living_south:
    - "nest:?client_id=NEST_CLIENT_ID&client_secret=NEST_CLIENT_SECRET&refresh_token=NEST_REFRESH_TOKEN&project_id=NEST_PROJECT_ID&device_id=NEST_CAM_SOUTH_ID"
    nest_entrance:
    - "nest:?client_id=NEST_CLIENT_ID&client_secret=NEST_CLIENT_SECRET&refresh_token=NEST_REFRESH_TOKEN&project_id=NEST_PROJECT_ID&device_id=NEST_CAM_ENTRANCE_ID"
detectors:
  coral:
    type: edgetpu
    device: usb
model:
  path: /edgetpu_model.tflite
  width: 320
  height: 320
  input_tensor: nhwc
  input_pixel_format: rgb
ffmpeg:
  hwaccel_args: preset-vaapi
record:
  enabled: true
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 30
  continuous:
    days: 0
  motion:
    days: 4
snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  crop: true
  retain:
    default: 30
semantic_search:
  enabled: true
  model_size: large
face_recognition:
  enabled: true
  min_area: 1500
  detection_threshold: 0.5
  recognition_threshold: 0.7
  unknown_score: 0.7
  save_attempts: 200
  blur_confidence_filter: true
objects:
  track:
  - person
  - car
  - truck
  - motorcycle
  - bicycle
  - dog
  - cat
  - bus
  filters:
    person:
      min_area: 5000
      min_score: 0.5
      threshold: 0.7
cameras:
  reolink_86:
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/reolink_86_sub
        roles:
        - detect
      - path: rtsp://127.0.0.1:8554/reolink_86
        roles:
        - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 10
    record:
      enabled: true
    snapshots:
      enabled: true
  reolink_87:
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/reolink_87_sub
        roles:
        - detect
      - path: rtsp://127.0.0.1:8554/reolink_87
        roles:
        - record
    detect:
      enabled: true
      width: 896
      height: 512
      fps: 10
    record:
      enabled: true
    snapshots:
      enabled: true
  reolink_85:
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/reolink_85_sub
        roles:
        - detect
      - path: rtsp://127.0.0.1:8554/reolink_85
        roles:
        - record
    detect:
      enabled: true
      width: 1920
      height: 576
      fps: 10
    record:
      enabled: true
    snapshots:
      enabled: true
  tapo_46:
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/tapo_46_sub
        roles:
        - detect
      - path: rtsp://127.0.0.1:8554/tapo_46
        roles:
        - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 10
    record:
      enabled: true
    snapshots:
      enabled: true
  eufy_living_pan:
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/eufy_living_pan
        roles:
        - detect
        - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 10
    record:
      enabled: true
    snapshots:
      enabled: true
  eufy_kitchen:
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/eufy_kitchen
        roles:
        - detect
        - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    snapshots:
      enabled: true
  eufy_living_north:
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/eufy_living_north
        roles:
        - detect
        - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    snapshots:
      enabled: true
  eufy_living_south:
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/eufy_living_south
        roles:
        - detect
        - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    snapshots:
      enabled: true
  # Battery Nest cams — alerts/detections only (no continuous recording to save battery)
  nest_living_north:
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/nest_living_north
        roles:
        - detect
        - record
    detect:
      enabled: true
      width: 1920
      height: 1200
      fps: 5
    record:
      enabled: true
      alerts:
        retain:
          days: 30
      detections:
        retain:
          days: 30
      continuous:
        days: 0
      motion:
        days: 0
    snapshots:
      enabled: true
  nest_living_south:
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/nest_living_south
        roles:
        - detect
        - record
    detect:
      enabled: true
      width: 1920
      height: 1200
      fps: 5
    record:
      enabled: true
      alerts:
        retain:
          days: 30
      detections:
        retain:
          days: 30
      continuous:
        days: 0
      motion:
        days: 0
    snapshots:
      enabled: true
  # Wired Nest cam — full recording OK
  nest_entrance:
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/nest_entrance
        roles:
        - detect
        - record
    detect:
      enabled: true
      width: 1920
      height: 1200
      fps: 5
    record:
      enabled: true
    snapshots:
      enabled: true
version: 0.17-0
